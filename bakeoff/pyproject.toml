[project]
name = "cq-bakeoff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "fastapi>=0.143.0",
    "google-auth>=2.62.0",
    "google-cloud-speech>=2.41.0",
    "google-cloud-texttospeech>=2.38.0",
    "google-cloud-translate>=3.28.0",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "opencc-python-reimplemented>=0.1.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
