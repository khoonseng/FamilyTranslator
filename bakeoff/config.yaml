# Bake-off configuration. Every model ID, endpoint, reasoning setting and voice lives here,
# never in code (hard rule 6). ${VAR} is replaced from the environment / bakeoff/.env.
# Values marked "verify" are checked by 00_smoke.py before any bench runs.

gcp:
  project: ${GCP_PROJECT}

stt:
  google:
    # Chirp 3 runs only in the `us` and `eu` multi-regions. Sync Recognize or streaming only,
    # never batch (hard rule 14).
    location: us
    endpoint: us-speech.googleapis.com
    model: chirp_3
    phrase_boost: 10            # glossary phrase biasing strength
    streaming:
      frame_ms: 100             # 3.2 KB per message; Google's cap is 25 KB
      tail_silence_s: 1.0       # silence after each chunk so Chirp 3 notices the pause
      # Level speech to this loudness (dBFS) before streaming; null = off. Tested 2026-10-23 on
      # the WeChat clips and rejected: levelled to -20 dBFS, Chirp 3 still dropped the same
      # 4.6 s of chunk 6-0008 (8 of 8 runs) and misheard more (火锅 -> 佛宗).
      target_rms_dbfs: null
  openai:
    # Safety net and fallback (decided 2026-10-24): gpt-transcribe. gpt-4o-transcribe scored
    # 32.3% error on the guides' clips (it skipped content) and is no longer run.
    models: [gpt-transcribe]

tts:
  google:
    endpoint: texttospeech.googleapis.com
    yue_language: yue-HK
    cmn_language: cmn-CN
    sample_rate_hz: 24000
    # Step 5: your 3 shortlisted Chirp 3 HD voices, from out/voices/shortlist.html.
    # yue_voices: []
    yue_voices: [yue-HK-Chirp3-HD-Despina, yue-HK-Chirp3-HD-Iapetus, yue-HK-Chirp3-HD-Zephyr]
    # An older (non-Chirp) voice, the fallback, played alongside as a reference.
    reference_voice: yue-HK-Standard-A
    cmn_voices: []
    # What every voice reads on the shortlist page: natural Cantonese from the bench.
    shortlist_texts:
      - 洪崖洞夜晚七點半之後會開燈，嗰陣時特別多人，大家一定要跟緊我，唔好走散呀。
      - 重慶係山城，好多路都要行上斜行落斜，行路嗰陣慢少少，小心腳下嘅梯級呀。

# Step 5: the in-laws' blind test (06 generates the clips, 07 builds the page, 08 scores).
blind_test:
  translations_log: translations_r2.jsonl   # the run whose finalists are compared
  # Round A (voice): the same text in each voice, from one translator so only the voice varies.
  voice_round: {sentences: [draft-00, draft-01, draft-02, draft-03, draft-04],
                text_from: gemini-minimal-t0.2}
  # Round B (translation): every drafted sentence from each finalist, in all four voices; the
  # page plays the voice the in-laws picked in round A.
  # Round C (speed): faster speech, as used when clips pile up.
  speed_round: {sentences: [draft-05, draft-06, draft-07], speaking_rate: 1.2,
                text_from: gemini-minimal-t0.2}

# Step 6: the Cloud Run test service (probe/). Google providers only, so it needs no API keys.
probe:
  translator: gemini-minimal-t0.2   # an llm.configs entry: the decided Gemini setting
  voice: yue-HK-Chirp3-HD-Despina   # the decided voice
  # /latency streams this sentence to Chirp 3 at real-time pace. It is synthesised once with a
  # Mandarin voice, so no recording goes into the container.
  sample_voice: cmn-CN-Chirp3-HD-Charon
  sample_text: 洪崖洞晚上七点半以后开灯，那个时候人特别多，大家一定要跟紧我，不要走散了。
  # /locktest: a numbered Cantonese clip every interval_s, so you can hear which ones played.
  locktest_interval_s: 15
  locktest_text: 第{n}段。呢段係鎖屏測試，聽到就代表鎖咗屏都仲有聲。
  locktest_max_minutes: 30          # a stream or socket ends after this, so none runs forever

mt:
  google:
    # Cloud Translation v3. Glossaries are regional, so use a region, not `global`.
    location: us-central1
    glossary_id: null           # set after the glossary is uploaded (step 4)

# Translation LLMs: ONE OpenAI-compatible client, one entry per provider/model/setting.
# `params` is sent as-is in the request body, so provider-specific reasoning switches
# stay in config. auth: google = service-account token (Vertex), else env var named.
# Sampling is per model (decided 2026-10-23): Gemini at temperature 0.2 (see below). Qwen
# and gpt-oss run at 0.2 and at their makers' recommended values; 0.2 won for both in run 1
# (the higher settings produced a 36x loop and a wrong time).
llm:
  providers:
    vertex:
      base_url: https://aiplatform.googleapis.com/v1/projects/${GCP_PROJECT}/locations/global/endpoints/openapi
      auth: google
      json_mode: json_object
    groq:
      base_url: https://api.groq.com/openai/v1
      auth: GROQ_API_KEY
      json_mode: json_object
  configs:
    # Gemini 3.6 Flash on Vertex accepts minimal | low | medium | high | max; `minimal` is its
    # "off" (smoke test 2026-10-22: no reasoning tokens).
    # The Gemini setting is temperature 0.2 (decided 2026-10-23). In the second run, Gemini at
    # 1.0 had ~7 errors in 29 outputs ("四十 processing 分鐘", 好多年夜食 for 小食) and at 0.2 had
    # 1, and was faster. Google advises 1.0 mainly for reasoning tasks; here reasoning is at
    # its minimum. The 1.0 configs (gemini-minimal, gemini-low) are retired; runs 1-2 in out/
    # still score because each log record carries its model and settings.
    gemini-minimal-t0.2:
      provider: vertex
      model: google/gemini-3.6-flash
      temperature: 0.2
      params: {reasoning_effort: minimal}
    gemini-low-t0.2:
      provider: vertex
      model: google/gemini-3.6-flash
      temperature: 0.2
      params: {reasoning_effort: low}
    # Qwen3.8-27B on Groq produced no reasoning even with reasoning_effort=default, so only
    # its sampling is varied. 0.7 / top-p 0.8 is Qwen3's guidance for non-thinking mode.
    qwen-t0.2:
      provider: groq
      model: qwen/qwen3.8-27b
      temperature: 0.2
      params: {reasoning_effort: none}
    qwen-t0.7:
      provider: groq
      model: qwen/qwen3.8-27b
      temperature: 0.7
      top_p: 0.8
      params: {reasoning_effort: none}
    # 1.0 / top-p 1.0 is OpenAI's guidance for gpt-oss.
    gptoss-low-t0.2:
      provider: groq
      model: openai/gpt-oss-120b
      temperature: 0.2
      params: {reasoning_effort: low, include_reasoning: false}
    gptoss-low-t1.0:
      provider: groq
      model: openai/gpt-oss-120b
      temperature: 1.0
      top_p: 1.0
      params: {reasoning_effort: low, include_reasoning: false}
  timeout_s: 20
  temperature: null             # default when a config sets none: the provider's own default
  context_sentences: 2          # previous source sentences sent as context (hard rule 7)

scoring:
  # Colloquial Cantonese markers: the 2026-10-14 list plus common spoken words it missed
  # (2026-10-22: 我哋而家嚟到洪崖洞 scored zero markers on the original list).
  colloquial_markers: [佢, 係, 嘅, 咗, 唔, 喺, 冇, 咩, 啲, 嘢,
                       哋, 嚟, 而家, 嗰, 畀, 啱, 咁, 喇, 囉, 喎, 乜, 點解, 邊度, 晒]
  # Characters that occur in written Cantonese but practically never in Mandarin transcripts.
  # Junk-filter layer 2 (decided 2026-10-23): a Guide-mode sentence is dropped when these make
  # up more than a set share of its characters (03_stt_score.py measures the share to use).
  # Chirp 3's language labels can't be used: it labelled Cantonese speech as Mandarin.
  cantonese_only_chars: [哋, 唔, 喺, 嘅, 咗, 冇, 佢, 嚟, 啲, 嘢, 嗰, 乜, 囉, 喎, 咩, 咁]
  junk_filter_shares: [0.10, 0.15, 0.20, 0.30]   # candidate thresholds the bake-off compares
  # Formal written-Chinese forms that colloquial Cantonese replaces (他→佢, 的→嘅, 是→係 ...).
  # Matched longest first, so 他們 counts once, not as 他 + 們.
  formal_markers: [他們, 她們, 他, 她, 它, 們, 的, 是, 在, 沒有, 沒, 這, 那, 什麼, 怎麼, 不]
  # Common words that contain a formal marker but are normal in spoken Cantonese too;
  # removed before counting formal markers.
  formal_exceptions: [不過, 不同, 不少, 不錯, 不斷, 不如, 不得了, 目的, 的士, 實在, 存在]
