[project]
name = "cq-translator"
version = "0.1.0"
description = "Chongqing Family Translator: backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "google-cloud-speech>=2.41.0",
    "google-cloud-texttospeech>=2.38.0",
    "google-cloud-translate>=3.28.0",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
