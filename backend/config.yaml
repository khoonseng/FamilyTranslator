# App configuration. Every model ID, endpoint, voice and threshold lives here, never in code
# (hard rule 6). ${VAR} is replaced from the environment (Cloud Run env and secrets, or
# backend/.env locally). Values come from the week-1 bake-off: docs/bakeoff-results.md.

# Language profile (owner decision 2026-11-23). This file is the Chongqing profile: a Mandarin
# guide and a Cantonese/English family. PROFILE=<name> merges profiles/<name>.yaml over it.
profile:
  name: chongqing
  title: Chongqing Family Translator  # the API docs; the phone pages keep their built title
  glossary: glossary.yaml
  page: null      # Chongqing serves the built page as it is; other profiles rewrite a few tags

gcp:
  project: ${GCP_PROJECT}

access:
  # Hard rule 1 (owner decision 2026-10-25): the hub needs both; the API and /docs need the
  # token. Both come from Secret Manager on Cloud Run. Empty = nobody gets in.
  hub_pin: ${HUB_PIN}
  api_token: ${API_TOKEN}
  # Listeners use the join link's token, kept in the bucket and renewable from host phones
  # (owner decision 2026-10-26); see app/rooms/room.py.

storage:
  # Clips, transcripts, usage and the join link; empty = in memory (tests, local runs).
  bucket: ${CLIP_BUCKET}

rooms:
  timezone: Asia/Shanghai # the trip-local day; bubbles start fresh each morning
  hub_offline_s: 20       # without a hub this long, listeners show "Hub offline"
  clips_in_memory: 200    # recent clips kept for catch-up; older ones come from Cloud Storage
  # Family replies (phase 2): Talk starts only after the guide has been quiet this long (hard
  # rule 8); a spoken reply is capped at this length (hold to talk).
  guide_quiet_s: 2
  max_talk_s: 30

stt:
  google:
    # Chirp 3 runs only in the `us` and `eu` multi-regions. Streaming only, never batch (rule 14).
    location: us
    endpoint: us-speech.googleapis.com
    model: chirp_3
    guide_languages: [cmn-Hans-CN, yue-Hant-HK]   # Guide mode (hard rule 8)
    family_languages: [yue-Hant-HK, en-US]        # Talk on a family phone (phase 2)
    hint_column: zh               # the glossary column used as phrase hints (the guide's language)
    phrase_boost: 10              # glossary phrase biasing strength
    endpointing: standard         # "short" split words and dropped more speech in week 1
    # One stream per hub segment, closed at the segment's end (decided 2026-10-25).
  openai:
    # Safety net and fallback (hard rule 9).
    model: gpt-transcribe
    timeout_s: 10
  safety_net:
    gap_s: 1.0            # finals must reach to within this of the segment's end
    back_s: 0.2           # start the uncovered audio this much earlier, so no word is clipped
    min_s: 0.5            # less uncovered audio than this isn't worth a call
    prompt_echo: "Places and dishes"   # gpt-transcribe repeating its prompt on silence

translation:
  # Tried in order per sentence; Cloud Translation is the last resort (hard rule 4). gpt-oss
  # joined on 2026-11-03: Groq's free limits apply per model, so it is a second allowance.
  order: [gemini, qwen, gpt-oss]
  # Gemini's `yue` must be complete within this, or the sentence goes to the next provider
  # (decided 2026-10-24; tuned in testing).
  yue_deadline_s: 2.5
  timeout_s: 10
  context_sentences: 2            # previous source sentences sent as context (hard rule 7)
  # Each direction's prompt (under prompts/), the JSON key the voice speaks (first in the
  # reply), the second key, and whether Latin letters in the spoken text are junk (run 6).
  directions:
    guide: {prompt: guide_to_family, speech_key: yue, other_key: en, latin_is_junk: true}
    family: {prompt: family_to_guide, speech_key: zh_hans, other_key: other, latin_is_junk: false}
  # Cloud Translation's language codes (hard rule 4); source "" lets Google detect it. A
  # reply's second language is `other_if_cjk` when it is written in Chinese characters.
  fallback:
    guide: {source: zh-CN, speech: yue, other: en}
    family: {source: "", speech: zh-CN, other_if_cjk: en, other_else: yue}
  providers:
    vertex:
      base_url: https://aiplatform.googleapis.com/v1/projects/${GCP_PROJECT}/locations/global/endpoints/openapi
      auth: google                # service-account token, no key
    groq:
      base_url: https://api.groq.com/openai/v1
      auth: GROQ_API_KEY
  models:
    gemini:
      provider: vertex
      model: google/gemini-3.6-flash
      temperature: 0.2
      params: {reasoning_effort: minimal}
      deadline: true              # the yue deadline applies (Vertex can be slow; run 6)
    qwen:
      provider: groq
      model: qwen/qwen3.8-27b     # Preview: re-check the ID before the trip
      temperature: 0.2
      params: {reasoning_effort: none}
    gpt-oss:
      provider: groq
      model: openai/gpt-oss-120b
      temperature: 0.2            # 1.0 looped in the bake-off (hard rule 6)
      params: {reasoning_effort: low, include_reasoning: false}   # its lowest; as in the bake-off
  cloud_translate:
    location: us-central1

tts:
  # By role, not language: `family_voice` speaks guide sentences to the family, `guide_voice`
  # speaks family replies to the guide (phase 2). Chongqing: Cantonese and Mandarin.
  family_voice:
    endpoint: texttospeech.googleapis.com
    language: yue-HK
    voices: [yue-HK-Chirp3-HD-Despina, yue-HK-Standard-A]   # main, then fallback
    speaking_rate: 1.0            # never sped up (hard rule 11)
    timeout_s: 8
  guide_voice:
    # Family replies to the guide (phase 2), played by the hub. Chosen for now (5 Nov); to be
    # revisited for a more natural voice once phase 2 works.
    endpoint: texttospeech.googleapis.com
    language: cmn-CN
    voices: [cmn-CN-Chirp3-HD-Kore, cmn-CN-Standard-A]
    speaking_rate: 1.0
    timeout_s: 8

pipeline:
  # Junk filter (hard rule 8). Layer 2: drop a sentence when characters only the family's
  # language uses (here Cantonese-only) exceed this share (provisional, decided 2026-10-25;
  # check against real family chatter). null switches layer 2 off; the label goes to the logs.
  foreign_share: 0.15
  foreign_chars: [哋, 唔, 喺, 嘅, 咗, 冇, 佢, 嚟, 啲, 嘢, 嗰, 乜, 囉, 喎, 咩, 咁]
  foreign_label: cantonese
  # Layer 3: very short sentences and filler.
  min_chars: 2
  filler: [嗯, 啊, 对, 對, 哦, 呃, 那个, 這個, 这个]
  # A sentence cut off by a pause waits this long for the guide to carry on (2026-10-25).
  hold_s: 1.5
  # Layer 4, echo detection (2026-10-25): drop a guide sentence that nearly matches one of our
  # translations from the last `echo_window_s` (mismatch below `echo_max_mismatch`).
  echo_window_s: 60
  echo_max_mismatch: 0.6
  # Bubbles (hard rule 9): a new one after a pause longer than this, or at these caps.
  bubble_pause_s: 2.0
  bubble_max_audio_s: 45
  bubble_max_sentences: 6

spending:
  # The spending meter (architecture doc, "App-side spending alert"): an estimate on host phones
  # only, with a warning above `warn_usd` a day; it never stops translation. Free allowances are
  # ignored, so the figure errs high. Prices in US$, checked against public pages in October
  # 2026 unless marked "estimate"; re-check before the trip.
  warn_usd: 12
  stt_per_minute: {chirp_3: 0.016, gpt-transcribe: 0.0045}
  llm_per_million_in: {gemini: 1.50, qwen: 0.30, gpt-oss: 0.15}   # qwen, gpt-oss: estimates,
  llm_per_million_out: {gemini: 7.50, qwen: 0.60, gpt-oss: 0.60}  # check Groq's pricing page
  mt_per_million_chars: 20                            # Cloud Translation, estimate
  tts_per_million_chars: {chirp3_hd: 30, standard: 4} # standard: estimate

